name: Integrate
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    name: Security
    steps:
      - uses: holepunchto/actions/security-base@v1
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: holepunchto/actions/node-base@v1
      - run: npm run lint
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - uses: holepunchto/actions/node-base@v1
      - uses: holepunchto/actions/setup-python@v1
      - uses: holepunchto/actions/install-pip-dependencies@v1
        with:
          packages: compact-encoding~=0.1.0 bare-rpc~=0.1.0
      - run: npm test
        env:
          HRPC_PYTHON: python
